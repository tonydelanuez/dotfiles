# Code rules shared across all language profiles.
# Loaded after global.yaml, before the profile-specific file.
# Put bracket/operator shortcuts here so every language gets them.

rules:
  # Brackets and delimiters
  - trigger: "open brace"
    replace: "{"
  - trigger: "close brace"
    replace: "}"
  - trigger: "open bracket"
    replace: "["
  - trigger: "close bracket"
    replace: "]"
  - trigger: "open paren"
    replace: "("
  - trigger: "close paren"
    replace: ")"
  - trigger: "open angle"
    replace: "<"
  - trigger: "close angle"
    replace: ">"

  # Operators
  - trigger: "equals equals"
    replace: "=="
  - trigger: "triple equals"
    replace: "==="
  - trigger: "not equals"
    replace: "!="
  - trigger: "strict not equals"
    replace: "!=="
  - trigger: "less than or equal"
    replace: "<="
  - trigger: "greater than or equal"
    replace: ">="
  - trigger: "arrow"
    replace: "->"
  - trigger: "fat arrow"
    replace: "=>"
  - trigger: "double colon"
    replace: "::"
  - trigger: "bang"
    replace: "!"
  - trigger: "double ampersand"
    replace: "&&"
  - trigger: "double pipe"
    replace: "||"
  - trigger: "dot dot dot"
    replace: "..."
  - trigger: "dot dot"
    replace: ".."