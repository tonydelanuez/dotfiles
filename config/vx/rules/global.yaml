# Global rules — applied in every mode before any mode-specific rules.
# Rules are matched case-insensitively and applied top-to-bottom.
#
# Format:
#   rules:
#     - trigger: "spoken phrase"
#       replace: "inserted text"
#
# Double-quoted values support escape sequences: \n  \t  \\  \"

rules:
  - trigger: "raw deployments"
    replace: "RawDeployments"
  - trigger: "raw deployment"
    replace: "RawDeployment"
  - trigger: "new line"
    replace: "\n"
  - trigger: "new paragraph"
    replace: "\n\n"
  - trigger: "tab key"
    replace: "\t"
  - trigger: "percent sign"
    replace: "%"
  - trigger: "at sign"
    replace: "@"
  - trigger: "hash sign"
    replace: "#"
  - trigger: "ampersand"
    replace: "&"
  - trigger: "asterisk"
    replace: "*"
  - trigger: "plus sign"
    replace: "+"
  - trigger: "minus sign"
    replace: "-"
  - trigger: "equals sign"
    replace: "="
  - trigger: "slash"
    replace: "/"
  - trigger: "backslash"
    replace: "\\"
  - trigger: "underscore"
    replace: "_"
  - trigger: "tilde"
    replace: "~"
  - trigger: "backtick"
    replace: "`"
  - trigger: "single quote"
    replace: "'"
  - trigger: "double quote"
    replace: "\""
  - trigger: "merge"
    replace: "/merge"
  # Coined product name — Whisper hears it as "five yard(s)".
  - trigger: "five yards"
    replace: "Vibeyard"
  - trigger: "five yard"
    replace: "Vibeyard"
  - trigger: "vibe yard"
    replace: "Vibeyard"
  - trigger: "vibe yards"
    replace: "Vibeyard"